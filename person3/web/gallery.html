<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AiTelier Catalogue Gallery</title>
  <style>
    :root {
      --ink: #18211c; --muted: #6e746d; --paper: #f4efe6; --card: #fffdf8;
      --line: #ded5c6; --accent: #bd5735; --accent-dark: #8f3c24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background: var(--paper);
      font: 15px/1.5 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    .shell { width: min(1420px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 60px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; color: #fff9ef; background: linear-gradient(145deg, #26382d, #76533f); font: 700 20px Georgia, serif; }
    .brand strong { display: block; font: 600 21px/1 Georgia, serif; }
    .brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    a { color: var(--accent-dark); }
    .back { font-size: 12px; text-decoration: none; }
    h1 { margin: 34px 0 8px; font: 500 clamp(34px, 4vw, 58px)/1 Georgia, serif; letter-spacing: -.04em; }
    .lede { margin: 0; color: var(--muted); font-size: 13px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 25px 0 13px; flex-wrap: wrap; }
    .bar h2 { margin: 0; font: 600 19px/1.2 Georgia, serif; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); border-radius: 99px; padding: 5px 10px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; }
    .chip.active { border-color: var(--accent); background: #fff4ea; color: var(--accent-dark); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
    .item { border: 1px solid var(--line); border-radius: 13px; background: var(--card); overflow: hidden; }
    .image-link { display: block; background: #ece5d9; }
    .image-link img { display: block; width: 100%; height: 170px; object-fit: contain; }
    .copy { display: grid; gap: 3px; padding: 10px 11px 12px; }
    .copy em { color: var(--accent); font-size: 9px; font-style: normal; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .copy b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 12px/1.25 Georgia, serif; }
    .copy span { color: var(--muted); font-size: 10px; }
    .copy a { font-size: 10px; }
    .empty { padding: 60px 20px; color: var(--muted); text-align: center; }
    @media (max-width: 620px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .image-link img { height: 140px; }
      header { align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="mark">A</div>
      <div><strong>AiTelier</strong><small>Catalogue images</small></div>
    </div>
    <a class="back" href="/">&larr; Back to studio</a>
  </header>
  <h1>All images in the input.</h1>
  <p class="lede" id="taskLine">Loading task catalogue...</p>
  <div class="bar">
    <h2 id="countLine">Catalogue</h2>
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">No images loaded.</div>
</div>
<script>
  const API_BASE = location.protocol === "file:" ? "http://127.0.0.1:21951" : "";
  const taskId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  const $ = (selector) => document.querySelector(selector);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[char]));
  const money = (value, currency = "EUR") => `${Number(value || 0).toFixed(2)} ${esc(currency)}`;
  let items = [];
  let activeLayer = "all";

  async function load() {
    if (!taskId) {
      $("#empty").textContent = "Task id is missing.";
      $("#empty").classList.remove("hidden");
      return;
    }
    $("#taskLine").textContent = `Task ${taskId} · every normalized catalogue item and its source image.`;
    try {
      const response = await fetch(`${API_BASE}/v1/style/${encodeURIComponent(taskId)}/catalogue`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Could not load the task catalogue.");
      items = data.items || [];
      const layers = Array.from(new Set(items.map((item) => item.layer)));
      $("#filters").innerHTML = ["all", ...layers].map((layer) => `
        <button class="chip ${activeLayer === layer ? "active" : ""}" type="button" data-layer="${esc(layer)}">${layer === "all" ? "All" : esc(layer)}</button>
      `).join("");
      $("#filters").querySelectorAll(".chip").forEach((button) => {
        button.addEventListener("click", () => {
          activeLayer = button.dataset.layer;
          $("#filters").querySelectorAll(".chip").forEach((value) => value.classList.toggle("active", value === button));
          paint();
        });
      });
      paint();
    } catch (error) {
      $("#taskLine").textContent = error.message;
      $("#empty").textContent = error.message;
      $("#empty").classList.remove("hidden");
    }
  }

  function paint() {
    const visible = activeLayer === "all" ? items : items.filter((item) => item.layer === activeLayer);
    $("#countLine").textContent = `${visible.length} image${visible.length === 1 ? "" : "s"}`;
    $("#grid").innerHTML = visible.map((item) => `
      <article class="item">
        <a class="image-link" href="${esc(item.image_url || "#")}" target="_blank" rel="noopener" title="Open image">
          <img src="${esc(item.image_url)}" alt="${esc(item.title)}" loading="lazy" onerror="this.style.opacity='0'">
        </a>
        <div class="copy">
          <em>${esc(item.layer)}</em>
          <b title="${esc(item.title)}">${esc(item.title)}</b>
          <span>${esc(item.brand || item.shop || "")}</span>
          <span>${money(item.price && item.price.amount, item.price && item.price.currency)}</span>
          <a href="${esc(item.product_url || "#")}" target="_blank" rel="noopener">Product page</a>
        </div>
      </article>
    `).join("");
    $("#empty").classList.toggle("hidden", visible.length > 0);
  }

  load();
</script>
</body>
</html>
